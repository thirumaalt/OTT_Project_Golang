version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# MyFlix — Go Backend Stack
# ─────────────────────────────────────────────────────────────────────────────

x-common-env: &common-env
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/myflix?sslmode=disable
  JWT_SECRET: ${JWT_SECRET:-changeme_use_a_real_secret_in_production}

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: myflix
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # ── Go Services ─────────────────────────────────────────────────────────────
  api-gateway:
    build: ./api-gateway
    ports:
      - "8094:8094"
    environment:
      <<: *common-env
      PORT: "8094"
      ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      AUTH_BASE_URL: http://auth-service:8083
      USER_BASE_URL: http://user-service:8085
      ANALYTICS_BASE_URL: http://analytics-service:8086
      RECOMMENDATION_BASE_URL: http://recommendation-service:8087
      WATCHHISTORY_BASE_URL: http://watchhistory-service:8090
      PAYMENT_BASE_URL: http://payment-service:8091
      SUBSCRIPTION_BASE_URL: http://subscription-service:8093
      INTERACTION_BASE_URL: http://interaction-service:8089
      METADATA_BASE_URL: http://metadata-service:8088
      MEDIA_BASE_URL: http://media-library-service:8001
    depends_on:
      - auth-service
      - user-service

  auth-service:
    build: ./auth-service
    ports:
      - "8083:8083"
    environment:
      <<: *common-env
      PORT: "8083"
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    build: ./user-service
    ports:
      - "8085:8085"
    environment:
      <<: *common-env
      PORT: "8085"
    depends_on:
      postgres:
        condition: service_healthy

  analytics-service:
    build: ./analytics-service
    ports:
      - "8086:8086"
    environment:
      <<: *common-env
      PORT: "8086"
    depends_on:
      postgres:
        condition: service_healthy

  recommendation-service:
    build: ./recommendation-service
    ports:
      - "8087:8087"
    environment:
      <<: *common-env
      PORT: "8087"
    depends_on:
      postgres:
        condition: service_healthy

  watchhistory-service:
    build: ./watchhistory-service
    ports:
      - "8090:8090"
    environment:
      <<: *common-env
      PORT: "8090"
    depends_on:
      postgres:
        condition: service_healthy

  payment-service:
    build: ./payment-service
    ports:
      - "8091:8091"
    environment:
      <<: *common-env
      PORT: "8091"
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy

  subscription-service:
    build: ./subscription-service
    ports:
      - "8093:8093"
    environment:
      <<: *common-env
      PORT: "8093"
    depends_on:
      postgres:
        condition: service_healthy

  media-library-service:
    build: ./media-library-service
    ports:
      - "8001:8001"
    environment:
      PORT: "8001"
      MEDIA_DATA_DIR: /media
    volumes:
      - ../Project_1_Traditional/media:/media:ro
    restart: unless-stopped

  frontend:
    build:
      context: ../Project_1_Traditional/frontend-ui
      dockerfile: ../../Project_Golang/frontend/Dockerfile
      args:
        VITE_API_BASE: ""
    ports:
      - "5173:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-gateway
    restart: unless-stopped

volumes:
  pgdata:
