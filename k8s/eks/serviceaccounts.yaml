# EKS IRSA — IAM Roles for Service Accounts
#
# WHAT IS IRSA?
#   On kind  → pods have no AWS permissions (no AWS)
#   On EKS   → pods need AWS permissions to access S3, RDS, Secrets Manager etc.
#
# OLD WAY (bad):
#   Store AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in k8s Secret
#   → keys can leak, hard to rotate, security risk
#
# IRSA WAY (good):
#   Pod → ServiceAccount → IAM Role → AWS Service
#   → no keys in code or secrets
#   → AWS automatically provides temporary credentials to the pod
#   → credentials auto-rotate every hour
#
# HOW IT WORKS:
#   1. Create IAM Role in AWS with required permissions (S3, Secrets Manager etc.)
#   2. Create ServiceAccount in Kubernetes with annotation pointing to IAM Role ARN
#   3. EKS links them via OIDC (OpenID Connect) — AWS trust relationship
#   4. Pod uses ServiceAccount → gets temporary AWS credentials automatically
#
# SETUP REQUIRED:
#   1. Enable OIDC on your EKS cluster:
#      eksctl utils associate-iam-oidc-provider --cluster myflix --approve
#
#   2. Create IAM roles with required policies in AWS Console or CLI
#      (replace ACCOUNT_ID and OIDC_ID with your actual values)
#
# ANNOTATION EXPLAINED:
#   eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/ROLE_NAME
#   → this links the Kubernetes ServiceAccount to an AWS IAM Role
#   → EKS sees this annotation and provides the IAM role credentials to the pod

---
# MEDIA SERVICE ACCOUNT
# Needs: S3 access (read/write media files on EKS with S3 instead of EFS)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: media-service-sa
  namespace: myflix
  annotations:
    # Replace ACCOUNT_ID with your AWS account ID (12 digit number)
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/myflix-media-role
---
# AUTH SERVICE ACCOUNT
# Needs: Secrets Manager access (read DB password, JWT secret)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service-sa
  namespace: myflix
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/myflix-auth-role
---
# API GATEWAY SERVICE ACCOUNT
# Needs: Secrets Manager access (read JWT secret for token validation)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway-sa
  namespace: myflix
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/myflix-api-gateway-role
---
# GENERAL SERVICE ACCOUNT — for services that only need Secrets Manager
# Used by: user, metadata, payment, subscription, analytics,
#          recommendation, interaction, watchhistory, transcoding
apiVersion: v1
kind: ServiceAccount
metadata:
  name: general-service-sa
  namespace: myflix
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/myflix-general-role
