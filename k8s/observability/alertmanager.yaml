apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: myflix
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      group_by: ["alertname", "job"]
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 30m
      receiver: default
      routes:
        - match:
            severity: critical
          receiver: critical

    receivers:
      - name: default
        webhook_configs:
          - url: http://localhost:5001/alerts
            send_resolved: true

      - name: critical
        webhook_configs:
          - url: http://localhost:5001/alerts
            send_resolved: true

    inhibit_rules:
      - source_match:
          severity: critical
        target_match:
          severity: warning
        equal: ["job"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: myflix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:latest
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: myflix
spec:
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: 9093
