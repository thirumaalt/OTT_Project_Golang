apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: myflix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: thiru98/user-service:latest
          ports:
            - containerPort: 8085
          env:
            - name: PORT
              value: "8085"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: jwt-secret
          envFrom:
            - configMapRef:
                name: app-config
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: myflix
spec:
  selector:
    app: user-service
  ports:
    - port: 8085
      targetPort: 8085
