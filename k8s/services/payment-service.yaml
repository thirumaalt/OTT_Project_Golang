apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: myflix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: thiru98/payment-service:latest
          ports:
            - containerPort: 8091
          env:
            - name: PORT
              value: "8091"
            - name: RAZORPAY_KEY_ID
              value: ""
            - name: RAZORPAY_KEY_SECRET
              value: ""
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: jwt-secret
          envFrom:
            - configMapRef:
                name: app-config
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8091
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: myflix
spec:
  selector:
    app: payment-service
  ports:
    - port: 8091
      targetPort: 8091
