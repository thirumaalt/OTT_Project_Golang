apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: faro-ingress
  namespace: myflix
  annotations:
    # Rewrite /faro/collect → /collect (Alloy's actual endpoint)
    nginx.ingress.kubernetes.io/rewrite-target: /collect
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /faro/collect
            pathType: Exact
            backend:
              service:
                name: alloy
                port:
                  number: 12347
