apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: myflix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: thiru98/api-gateway:latest
          ports:
            - containerPort: 8094
          env:
            - name: PORT
              value: "8094"
            - name: ALLOWED_ORIGINS
              value: "*"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: jwt-secret
          envFrom:
            - configMapRef:
                name: app-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8094
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: myflix
spec:
  selector:
    app: api-gateway
  type: NodePort
  ports:
    - port: 8094
      targetPort: 8094
      nodePort: 30094
