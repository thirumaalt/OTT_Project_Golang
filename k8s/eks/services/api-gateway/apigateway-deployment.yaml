apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: myflix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: thiru98/api-gateway:latest
          ports:
            - containerPort: 8094
          env:
            - name: PORT
              value: "8094"
            - name: ALLOWED_ORIGINS
              value: "*"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: jwt-secret
          envFrom:
            - configMapRef:
                name: app-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8094
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8094
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
