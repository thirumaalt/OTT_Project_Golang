# EKS SECRETS — AWS Secrets Manager via External Secrets Operator
#
# DIFFERENCE FROM KIND:
#   kind    → k8s Secret with base64 encoded values (not truly encrypted)
#   EKS     → AWS Secrets Manager (encrypted, audited, auto-rotated)
#
# HOW IT WORKS ON EKS:
#   AWS Secrets Manager (real secret)
#     → External Secrets Operator (ESO) reads it
#       → creates k8s Secret automatically
#         → pod uses k8s Secret as normal
#
# WHY NOT JUST USE K8S SECRET ON EKS?
#   - k8s Secrets are stored in etcd (unencrypted by default)
#   - AWS Secrets Manager is encrypted with KMS
#   - Can auto-rotate passwords
#   - Full audit trail (who accessed what, when)
#   - Centralized — one place to manage all secrets
#
# SETUP REQUIRED:
#   1. Install External Secrets Operator:
#      helm repo add external-secrets https://charts.external-secrets.io
#      helm install external-secrets external-secrets/external-secrets -n myflix
#
#   2. Create secrets in AWS Secrets Manager:
#      aws secretsmanager create-secret \
#        --name myflix/postgres \
#        --secret-string '{"password":"yourpassword","username":"postgres"}'
#
#   3. Apply this file:
#      kubectl apply -f k8s/eks/secrets.yaml

---
# SECRETSTORE — tells ESO how to connect to AWS Secrets Manager
#
# provider.aws.service: SecretsManager
#   → use AWS Secrets Manager (not Parameter Store)
#
# provider.aws.region: us-east-1
#   → which AWS region your secrets are in
#
# provider.aws.auth.jwt
#   → use IRSA (ServiceAccount token) to authenticate to AWS
#   → no AWS keys needed — uses the serviceAccountRef below
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: myflix
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: general-service-sa   # the IRSA service account we created
---
# EXTERNALSECRET — pulls secret from AWS and creates k8s Secret
#
# refreshInterval: 1h
#   → ESO checks AWS Secrets Manager every 1 hour for updates
#   → if you rotate the password in AWS, k8s Secret auto-updates
#
# secretStoreRef
#   → which SecretStore to use (defined above)
#
# target.name: postgres-secret
#   → name of the k8s Secret that ESO will create
#   → your pods reference this like any normal k8s Secret
#
# data[].remoteRef.key: myflix/postgres
#   → path in AWS Secrets Manager
#
# data[].remoteRef.property: password
#   → which field inside the secret JSON to extract
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-secret
  namespace: myflix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: postgres-secret      # k8s Secret name pods will use
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: myflix/postgres   # AWS Secrets Manager secret name
        property: password
    - secretKey: POSTGRES_USER
      remoteRef:
        key: myflix/postgres
        property: username
---
# JWT SECRET — used by api-gateway and auth-service
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jwt-secret
  namespace: myflix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: jwt-secret
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: myflix/jwt
        property: secret
