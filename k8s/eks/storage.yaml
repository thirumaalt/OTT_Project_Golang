# EKS STORAGE — AWS EFS (Elastic File System)
#
# DIFFERENCE FROM KIND:
#   kind    → emptyDir (data lost on restart, one pod only)
#   EKS     → EFS PVC  (data persists, multiple pods can read+write)
#
# WHY EFS FOR MEDIA?
#   - media-library-service uploads files
#   - transcoding-service reads and processes those same files
#   - Both pods need access simultaneously → ReadWriteMany
#   - EFS is AWS managed NFS (Network File System) → supports ReadWriteMany
#   - EBS (Elastic Block Store) only supports ReadWriteOnce — not suitable
#
# WHY EBS FOR POSTGRES?
#   - Only one postgres pod reads/writes at a time → ReadWriteOnce
#   - EBS is faster than EFS for single-pod databases
#   - EBS = SSD attached to one node, EFS = network file system
#
# SETUP REQUIRED BEFORE APPLYING:
#   1. Install EFS CSI Driver on EKS:
#      kubectl apply -k "github.com/kubernetes-sigs/aws-efs-csi-driver/deploy/kubernetes/overlays/stable/?ref=release-2.0"
#
#   2. Create EFS filesystem in AWS Console or CLI:
#      aws efs create-file-system --region us-east-1
#      → copy the FileSystemId (fs-xxxxxxxx)
#
#   3. Replace YOUR_EFS_ID below with your actual EFS filesystem ID

---
# STORAGECLASS — tells Kubernetes how to provision EFS volumes
# One StorageClass can be used by many PVCs
#
# provisioner: efs.csi.aws.com
#   → uses the EFS CSI driver we installed
#
# parameters.provisioningMode: efs-ap
#   → creates an EFS Access Point for each PVC (isolated directory)
#
# parameters.fileSystemId: YOUR_EFS_ID
#   → which EFS filesystem to use
#
# reclaimPolicy: Retain
#   → when PVC is deleted, keep the data (don't delete EFS data)
#   → Retain is safer than Delete for production media files
#
# volumeBindingMode: Immediate
#   → create the volume immediately when PVC is created
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-sc
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  fileSystemId: YOUR_EFS_ID       # replace with your EFS ID e.g. fs-0123456789abcdef
  directoryPerms: "700"
reclaimPolicy: Retain
volumeBindingMode: Immediate
---
# PVC FOR MEDIA STORAGE — used by media-library and transcoding service
#
# accessModes: ReadWriteMany
#   → multiple pods can read and write at the same time
#   → this is why we use EFS (EBS doesn't support this)
#
# storageClassName: efs-sc
#   → use the EFS StorageClass we defined above
#   → kind uses default local storage, EKS uses efs-sc
#
# storage: 50Gi
#   → request 50GB — EFS is elastic so it grows automatically
#   → this is just a logical size for Kubernetes tracking
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-pvc
  namespace: myflix
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: efs-sc
  resources:
    requests:
      storage: 50Gi
---
# PVC FOR POSTGRES — uses EBS (faster for single pod DB)
#
# accessModes: ReadWriteOnce
#   → only one postgres pod reads/writes
#   → EBS supports this and is faster than EFS for DB workloads
#
# storageClassName: gp3
#   → AWS GP3 SSD EBS volume (faster and cheaper than gp2)
#   → automatically available on EKS, no extra setup needed
#
# storage: 20Gi
#   → 20GB for postgres data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: myflix
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 20Gi
