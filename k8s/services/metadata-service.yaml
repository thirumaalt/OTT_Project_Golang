apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadata-service
  namespace: myflix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metadata-service
  template:
    metadata:
      labels:
        app: metadata-service
    spec:
      containers:
        - name: metadata-service
          image: thiru98/metadata-service:latest
          ports:
            - containerPort: 8088
          env:
            - name: PORT
              value: "8088"
            - name: TMDB_API_KEY
              value: "ebe7d8b6bb429b017bf62e41a4f42820"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: jwt-secret
          envFrom:
            - configMapRef:
                name: app-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: metadata-service
  namespace: myflix
spec:
  selector:
    app: metadata-service
  ports:
    - port: 8088
      targetPort: 8088
