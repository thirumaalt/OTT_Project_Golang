apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-dashboard
  namespace: myflix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-dashboard
  template:
    metadata:
      labels:
        app: admin-dashboard
    spec:
      containers:
        - name: admin-dashboard
          image: thiru98/admin-dashboard:latest
          ports:
            - containerPort: 5174
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 5174
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5174
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: admin-dashboard
  namespace: myflix
spec:
  selector:
    app: admin-dashboard
  ports:
    - port: 5174
      targetPort: 5174
