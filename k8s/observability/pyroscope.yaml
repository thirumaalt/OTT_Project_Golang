apiVersion: v1
kind: ConfigMap
metadata:
  name: pyroscope-config
  namespace: myflix
data:
  config.yaml: |
    storage:
      backend: filesystem
      filesystem:
        dir: /data/pyroscope
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pyroscope
  namespace: myflix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pyroscope
  template:
    metadata:
      labels:
        app: pyroscope
    spec:
      containers:
        - name: pyroscope
          image: grafana/pyroscope:1.7.1
          args:
            - -config.file=/etc/pyroscope/config.yaml
          ports:
            - containerPort: 4040
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_INSTALL_PLUGINS
              value: grafana-pyroscope-app
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/pyroscope
            - name: data
              mountPath: /data/pyroscope
          readinessProbe:
            httpGet:
              path: /ready
              port: 4040
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /ready
              port: 4040
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
      volumes:
        - name: config
          configMap:
            name: pyroscope-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pyroscope
  namespace: myflix
spec:
  selector:
    app: pyroscope
  type: NodePort
  ports:
    - port: 4040
      targetPort: 4040
      nodePort: 30040