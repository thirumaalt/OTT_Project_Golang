apiVersion: apps/v1
kind: Deployment
metadata:
  name: interaction-service
  namespace: myflix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: interaction-service
  template:
    metadata:
      labels:
        app: interaction-service
    spec:
      containers:
        - name: interaction-service
          image: thiru98/interaction-service:latest
          ports:
            - containerPort: 8089
          env:
            - name: PORT
              value: "8089"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: jwt-secret
          envFrom:
            - configMapRef:
                name: app-config
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8089
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: interaction-service
  namespace: myflix
spec:
  selector:
    app: interaction-service
  ports:
    - port: 8089
      targetPort: 8089
