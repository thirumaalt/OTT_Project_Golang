# SonarQube / SonarCloud configuration for the myflix OTT monorepo.
sonar.projectKey=thirumaalt_OTT_Project_Golang
sonar.projectName=OTT Platform (myflix)

# --- SonarCloud only: uncomment and set your organization ---
# sonar.organization=thirumaalt

# Scan all service source; skip vendored, build and infra artifacts.
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/vendor/**,**/*.exe,**/*.zip,k8s/**,observability/**,docs/**,**/*.md

# Go
sonar.go.exclusions=**/vendor/**

sonar.sourceEncoding=UTF-8

# Don't block the pipeline waiting on the quality gate (flip to true once you
# have a gate you want to enforce):
# sonar.qualitygate.wait=false